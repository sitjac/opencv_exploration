name: Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_NAME: "vision-lab"
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            artifact_ext: '.zip',
            os: windows-2019,
            cc: "cl",
            cxx: "cl",
            environment_script: "C:/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/VC/Auxiliary/Build/vcvars64.bat",
          }
        - {
            name: "Ubuntu Latest GCC",
            artifact_ext: '.tar.gz',
            os: ubuntu-22.04,
            cc: "gcc",
            cxx: "g++",
          }
        - {
            name: "macOS Latest Clang",
            artifact_ext: '.tar.gz',
            os: macos-latest,
            cc: "clang",
            cxx: "clang++",
          }

    steps:
    - name: set version name (Windows)
      id: version_win
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $TAG = (${env:GITHUB_REF} -replace 'refs/tags/', '')
        echo "name=$TAG" >> ${env:GITHUB_OUTPUT}
    
    - name: set version name
      id: version
      if: ${{ runner.os != 'Windows' }}
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "name=$TAG" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: cache Conan
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && 'C:/Users/runneradmin/.conan' || '~/.conan' }}
        key: ${{ runner.os }}-conan-${{ hashFiles('cmake/Conan.cmake') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: install Conan 1
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          python -m pip install --break-system-packages conan==1.65.0
        else
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages conan==1.65.0
        fi

    - name: install Conan system requirements
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libva-dev libvdpau-dev libx11-dev libx11-xcb-dev libfontenc-dev libice-dev \
          libsm-dev libxau-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev \
          libxdmcp-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxkbfile-dev \
          libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxrender-dev libxres-dev \
          libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev \
          libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev \
          libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev \
          libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev \
          libxcb-cursor-dev libxcb-dri2-0-dev libxcb-present-dev libxcb-composite0-dev \
          libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev

    - name: configure Conan remote
      run: conan remote update conancenter https://center.conan.io || true

    - name: extend Conan settings for current compiler
      if: runner.os == 'macOS'
      run: |
        python3 - <<'EOF'
        import os, re
        from pathlib import Path
        from conans.client.conf import get_default_settings_yml

        out = os.popen("clang --version").read()
        m = re.search(r"version (\d+)\.(\d+)", out)
        if not m:
            raise SystemExit("Could not detect clang version")
        version = f"{m.group(1)}.{m.group(2)}"

        home = Path.home() / ".conan"
        home.mkdir(exist_ok=True)
        text = get_default_settings_yml()
        m2 = re.search(r"(apple-clang:.*?version: \[)([^\]]*)(\])", text, re.S)
        if m2:
            prefix, body, suffix = m2.group(1), m2.group(2), m2.group(3)
            items = [item.strip() for item in body.split(",") if item.strip()]
            if version not in [item.strip('"') for item in items]:
                items.append(f'"{version}"')
                body = ", ".join(items)
                text = text[:m2.start(2)] + body + text[m2.end(2):]
        (home / "settings.yml").write_text(text)
        print(f"Extended Conan settings with apple-clang {version}")
        EOF

    - name: cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ github.HOME }}/.local
        key: ${{ runner.os }}-dependencies-${{ hashFiles('CMakeLists.txt') }}

    - name: install GoogleTest
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: |
        cd ..
        git clone https://github.com/google/googletest.git --branch v1.17.0
        cd googletest
        cmake -Bbuild -DCMAKE_INSTALL_PREFIX="$HOME/.local" -Dgtest_force_shared_crt=1
        cmake --build build --config Release
        cmake --build build --target install --config Release

    - name: configure (Windows)
      if: runner.os == 'Windows'
      run: cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local" -G "Visual Studio 16 2019" -A x64

    - name: configure
      if: runner.os != 'Windows'
      run: cmake --preset release -DCMAKE_INSTALL_PREFIX="$HOME/.local"
      
    - name: build
      run: cmake --build --preset release --config Release

    - name: run tests
      run: |
        cd build-release
        ctest -C Release -VV

    # for a release not containing directly the source code, replace the files archived
    # with the actual files needed (i.e. *.lib/*.a and *.h(pp))

    - name: generate archive (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: |
        rmdir -r -fo build-release
        7z a -tzip $HOME/artifact.zip *


    - name: generate archive
      if: ${{ runner.os != 'Windows' }}
      run: |
        rm -rf build-release
        tar -cvzf $HOME/artifact.tar.gz .

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      if: ${{ runner.os == 'Windows' }}
      with:
        name: ${{ runner.os }}-${{ steps.version_win.outputs.name }}
        path: '~/artifact.*'

    - name: upload artifacts
      uses: actions/upload-artifact@v4
      if: ${{ runner.os != 'Windows' }}
      with:
        name: ${{ runner.os }}-${{ steps.version.outputs.name }}
        path: '~/artifact.*'

  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: set version name
      id: version
      run: echo ::set-output name=name::${GITHUB_REF#refs/tags/}

    - name: create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ steps.version.outputs.name }}
        # if needed, you can set the release body here
        #body: "Release notes"
        draft: false
        prerelease: false

    - name: download artifact
      uses: actions/download-artifact@v4
      with:
        name: "Linux-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload ubuntu release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: "artifact.tar.gz"
        asset_name: "${{ env.PROJECT_NAME }}-Linux-${{ steps.version.outputs.name }}.tar.gz"
        asset_content_type: application/x-tar

    - name: download artifact
      uses: actions/download-artifact@v4
      with:
        name: "Windows-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload windows release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: "artifact.zip"
        asset_name: "${{ env.PROJECT_NAME }}-Windows-${{ steps.version.outputs.name }}.zip"
        asset_content_type: application/zip

    - name: download artifact
      uses: actions/download-artifact@v4
      with:
        name: "macOS-${{ steps.version.outputs.name }}"
        path: ./

    - name: upload macos release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: "./artifact.tar.gz"
        asset_name: "${{ env.PROJECT_NAME }}-macOS-${{ steps.version.outputs.name }}.tar.gz"
        asset_content_type: application/x-tar
