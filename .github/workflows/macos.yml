name: MacOS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release
  INSTALL_LOCATION: .local

jobs:
  build:

    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v4

    - name: cache Conan
      uses: actions/cache@v4
      with:
        path: ~/.conan
        key: ${{ runner.os }}-conan-${{ hashFiles('cmake/Conan.cmake') }}
        restore-keys: |
          ${{ runner.os }}-conan-

    - name: install Conan 1
      run: python3 -m pip install --break-system-packages conan==1.65.0

    - name: configure Conan remote
      run: conan remote update conancenter https://center.conan.io || true

    - name: extend Conan settings for current compiler
      run: |
        python3 - <<'EOF'
        import os, re
        from pathlib import Path
        from conans.client.conf import get_default_settings_yml

        out = os.popen("clang --version").read()
        m = re.search(r"version (\d+)\.(\d+)", out)
        if not m:
            raise SystemExit("Could not detect clang version")
        version = f"{m.group(1)}.{m.group(2)}"

        home = Path.home() / ".conan"
        home.mkdir(exist_ok=True)
        text = get_default_settings_yml()
        m2 = re.search(r"(apple-clang:.*?version: \[)([^\]]*)(\])", text, re.S)
        if m2:
            prefix, body, suffix = m2.group(1), m2.group(2), m2.group(3)
            items = [item.strip() for item in body.split(",") if item.strip()]
            if version not in [item.strip('"') for item in items]:
                items.append(f'"{version}"')
                body = ", ".join(items)
                text = text[:m2.start(2)] + body + text[m2.end(2):]
        (home / "settings.yml").write_text(text)
        print(f"Extended Conan settings with apple-clang {version}")
        EOF
      
    - name: cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ github.workspace }}/${{ env.INSTALL_LOCATION }}
        key: ${{ runner.os }}-dependencies-${{ hashFiles('CMakeLists.txt') }}

    - name: install GoogleTest
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      run: |
        cd ..
        git clone https://github.com/google/googletest.git --branch v1.17.0
        cd googletest
        cmake -Bbuild -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION
        cmake --build build --config Release
        cmake --build build --target install --config Release

    - name: configure
      run: cmake --preset release -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION
      
    - name: build
      run: cmake --build --preset release

    - name: run tests
      run: |
        cd build-release
        ctest -C $BUILD_TYPE -VV

    - name: install project
      run: cmake --build build-release --target install --config Release 
